name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # App 專案會把這個資料夾複製到輸出與單一 EXE 裡；只指向網站子資料夾，
      # 不要把整個 ANDROID-APP-DEV 打包進 web\。
      WebSourceRoot: ${{ github.workspace }}\android-app-dev\gpstracker-web\

    steps:
      - name: Checkout PC repo
        uses: actions/checkout@v4

      - name: Checkout gpstracker-web
        uses: actions/checkout@v4
        with:
          repository: wahaha232/ANDROID-APP-DEV
          path: android-app-dev
          # 只取網站子資料夾，其他 App（GPSTracker、Calculator…）不要下載。
          sparse-checkout: gpstracker-web
          sparse-checkout-cone-mode: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test GpsTrackerPc.sln -c Release --nologo

      - name: Validate release version and changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "gpstracker-desktop-latest"
          $releaseName = ""
          $releaseJson = gh release view $tag --json name 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $releaseName = ($releaseJson | ConvertFrom-Json).name
          }

          # Release 還不存在時 gh 會回非 0；不清掉會讓這一步在成功後仍以 1 結束。
          $global:LASTEXITCODE = 0

          $guardJson = & "$env:GITHUB_WORKSPACE\scripts\release-guard.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE\src\GpsTrackerPc.App\GpsTrackerPc.App.csproj" `
            -ChangelogPath "$env:GITHUB_WORKSPACE\CHANGELOG.md" `
            -CurrentReleaseName $releaseName
          $guard = $guardJson | ConvertFrom-Json

          $guard.Notes | Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\release-notes.md" -Encoding utf8
          "VERSION=$($guard.Version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本檢查通過：v$($guard.Version)"

      - name: Verify web source folder
        shell: pwsh
        run: |
          # 單檔發佈會把網頁內嵌進 EXE，publish\ 不會有 web 資料夾；
          # 所以要檢查真正被複製進去的來源資料夾，而不是發佈輸出。
          $web = $env:WebSourceRoot
          if ([string]::IsNullOrWhiteSpace($web) -or -not (Test-Path -LiteralPath $web -PathType Container)) {
            throw "找不到 WebSourceRoot：$web（sparse-checkout 沒有取到 gpstracker-web）"
          }

          $index = Join-Path $web "index.html"
          if (-not (Test-Path -LiteralPath $index -PathType Leaf)) {
            throw "網頁來源缺少 index.html：$index"
          }

          # 這些資料夾出現在來源就代表 WebSourceRoot 指錯層級（整個 repo 被包進 web\）。
          $forbidden = @("gpstracker-web", "GPSTracker", "Calculator", "HealthTracker", "WEATHER APP_V2", ".git")
          $bad = @(Get-ChildItem -LiteralPath $web -Directory -Recurse -Force |
            Where-Object { $forbidden -contains $_.Name })
          if ($bad.Count -gt 0) {
            $names = ($bad | ForEach-Object { $_.FullName.Substring($web.Length).TrimStart('\') }) -join "、"
            throw "WebSourceRoot 裡有不該出現的資料夾：$names"
          }

          $fileCount = @(Get-ChildItem -LiteralPath $web -Recurse -File).Count
          Write-Host "網頁來源檢查通過：$index，共 $fileCount 個檔案"

      - name: Publish Windows x64
        run: >
          dotnet publish src/GpsTrackerPc.App/GpsTrackerPc.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Package and checksum
        shell: pwsh
        run: |
          $exe = "publish\GpsTrackerPc.exe"
          if (-not (Test-Path $exe)) {
            throw "找不到 $exe"
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GpsTrackerPc.exe" | Set-Content "GpsTrackerPc.exe.sha256" -Encoding ascii
          Write-Host "打包完成：GpsTrackerPc.exe（v$env:VERSION）"

      - name: Create or update Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "gpstracker-desktop-latest"
          $title = "GPS Tracker PC v$env:VERSION"
          $notesFile = "$env:GITHUB_WORKSPACE\release-notes.md"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes-file $notesFile --target $env:GITHUB_SHA --latest
          } else {
            gh release edit $tag --title $title --notes-file $notesFile --latest
          }

          gh release upload $tag "publish\GpsTrackerPc.exe" "GpsTrackerPc.exe.sha256" --clobber
